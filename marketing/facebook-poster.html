<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MySoft Attendance – Facebook poster</title>
<!--
  Facebook post image, 1080 x 1350 (4:5). Open with ?lang=en or ?lang=km.
  Rendered to PNG by tools in the scratchpad (headless Chrome at 2x): facebook-poster-en.png / facebook-poster-km.png
-->
<style>
  :root {
    --navy: #06163d;
    --blue: #1d4ed8;
    --sky: #c9d8ff;
    --amber: #fbbf24;
    --amber-deep: #f59e0b;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--navy); }
  body {
    font-family: 'Segoe UI', 'Khmer UI', system-ui, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  body.km { font-family: 'Segoe UI', 'Khmer UI', 'Khmer OS Siemreap', sans-serif; }

  .poster {
    position: relative; width: 1080px; height: 1350px; padding: 46px 60px 44px;
    display: flex; flex-direction: column; gap: 18px;
    background:
      radial-gradient(900px 600px at 85% 38%, rgba(59, 130, 246, 0.55), transparent 70%),
      radial-gradient(700px 500px at 0% 100%, rgba(29, 78, 216, 0.6), transparent 70%),
      linear-gradient(165deg, #06163d 0%, #0b2a6f 55%, #123b9e 100%);
    overflow: hidden;
  }
  .poster::before { /* faint dot grid */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.09) 1.4px, transparent 1.6px);
    background-size: 28px 28px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.15) 60%, rgba(0,0,0,0.5));
  }
  .poster > * { position: relative; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { background: #fff; border-radius: 18px; padding: 12px 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
  .logo img { display: block; height: 52px; }
  .tag { border: 1.5px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 10px 20px; font-size: 21px; font-weight: 600; color: var(--sky); letter-spacing: 0.2px; }

  /* Headline */
  h1 { font-size: 64px; line-height: 1.06; font-weight: 800; letter-spacing: -1.5px; }
  h1 em { font-style: normal; color: var(--amber); }
  body.km h1 { font-size: 52px; line-height: 1.4; letter-spacing: 0; font-weight: 700; }
  .sub { font-size: 23px; line-height: 1.45; color: var(--sky); max-width: 940px; margin-top: -6px; }
  body.km .sub { font-size: 20px; line-height: 1.65; }

  /* Product shots */
  .shots { height: 394px; flex: none; position: relative; }
  .laptop { position: absolute; left: 40px; top: 0; width: 572px; }
  .laptop .screen {
    background: #0b1220; border-radius: 22px 22px 6px 6px; padding: 14px 14px 16px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 0 0 2px #2a3550;
  }
  .laptop .screen img { display: block; width: 100%; border-radius: 6px; }
  .laptop .base { height: 20px; margin: 0 -34px; background: linear-gradient(#cbd5e1, #94a3b8); border-radius: 0 0 22px 22px; box-shadow: 0 16px 30px rgba(0,0,0,0.4); }
  .laptop .base::after { content: ''; display: block; width: 130px; height: 7px; margin: 0 auto; background: #64748b; border-radius: 0 0 8px 8px; }
  .phone {
    position: absolute; right: 70px; top: -6px; width: 182px; height: 392px;
    background: #0b1220; border-radius: 38px; padding: 10px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 2px #2a3550;
  }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 29px; }
  .chip {
    position: absolute; display: flex; align-items: center; gap: 12px;
    background: #fff; color: #0f172a; border-radius: 16px; padding: 12px 18px;
    box-shadow: 0 16px 34px rgba(0,0,0,0.35); font-size: 19px; font-weight: 600;
  }
  .chip .dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .chip small { display: block; font-size: 15px; font-weight: 500; color: #64748b; }
  .chip.in { left: 560px; top: 286px; }
  .chip.in .dot { background: #dcfce7; color: #15803d; }
  .chip.gps { left: 430px; top: 22px; }
  .chip.gps .dot { background: #dbeafe; color: #1d4ed8; }

  /* Features */
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .feature {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 16px;
    font-size: 19px; font-weight: 600; line-height: 1.25;
  }
  body.km .feature { font-size: 16px; line-height: 1.5; font-weight: 600; }
  .feature .ic { width: 44px; height: 44px; border-radius: 12px; background: rgba(251,191,36,0.16); color: var(--amber); display: grid; place-items: center; flex: none; }

  /* Offer */
  .offer {
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    background: linear-gradient(90deg, var(--amber), var(--amber-deep)); color: #1f1300;
    border-radius: 20px; padding: 14px 28px; box-shadow: 0 16px 40px rgba(245,158,11,0.35);
  }
  .offer .big { font-size: 34px; font-weight: 800; letter-spacing: -0.3px; }
  body.km .offer .big { font-size: 30px; font-weight: 700; }
  .offer .price { text-align: right; font-size: 20px; font-weight: 600; }
  .offer .price b { display: block; font-size: 36px; font-weight: 800; line-height: 1.1; }
  body.km .offer .price { font-size: 18px; }

  /* Footer */
  .foot { display: flex; gap: 26px; align-items: stretch; margin-top: auto; }
  .contact { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .cta { display: flex; align-items: center; gap: 14px; font-size: 22px; color: var(--sky); }
  .cta b { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.3px; }
  body.km .cta { font-size: 20px; }
  .cta .ic { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; flex: none; }
  .lines { display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: 21px; color: #e6edff; padding-left: 60px; }
  .lines span { display: inline-flex; align-items: center; gap: 8px; }
  .qr { width: 172px; background: #fff; border-radius: 20px; padding: 12px 12px 10px; text-align: center; color: #0f172a; box-shadow: 0 16px 34px rgba(0,0,0,0.35); }
  .qr img { display: block; width: 100%; border-radius: 8px; }
  .qr div { font-size: 15px; font-weight: 700; margin-top: 6px; line-height: 1.3; }
  body.km .qr div { font-size: 14px; }
</style>
</head>
<body>
<div class="poster">
  <div class="top">
    <div class="logo"><img src="logo.png" alt="MySoft Attendance"></div>
    <div class="tag" data-t="tag"></div>
  </div>

  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>

  <div class="shots">
    <div class="laptop">
      <div class="screen"><img src="dashboard.png" alt=""></div>
      <div class="base"></div>
    </div>
    <div class="phone"><img src="phone.png" alt=""></div>
    <div class="chip gps">
      <span class="dot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
      <span><span data-t="gps"></span><small data-t="gpsSub"></small></span>
    </div>
    <div class="chip in">
      <span class="dot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span><span data-t="in"></span><small data-t="inSub"></small></span>
    </div>
  </div>

  <div class="features" id="features"></div>

  <div class="offer">
    <div class="big" data-t="trial"></div>
    <div class="price"><span data-t="from"></span><b data-t="price"></b></div>
  </div>

  <div class="foot">
    <div class="contact">
      <div class="cta">
        <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
        <span><span data-t="demo"></span><br><b>demo.mysoftkh.com</b></span>
      </div>
      <div class="cta">
        <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
        <span><span data-t="signup"></span><br><b>www.mysoftkh.com</b></span>
      </div>
      <div class="lines">
        <span>☎ 014 789 987 · 096 89 99 169</span>
        <span>✉ Sales@mysoftkh.com</span>
      </div>
    </div>
    <div class="qr">
      <img src="telegram-qr.png" alt="Telegram @mysoftkh">
      <div data-t="qr"></div>
    </div>
  </div>
</div>

<script>
  const ICONS = {
    qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2.5 2.5L16 13"/>',
    money: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/>',
    tg: '<path d="M21 4L3 11l6.5 2.2M21 4l-3 16-8.5-6.8M21 4L9.5 13.2V19l3-3.2"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  };
  const T = {
    en: {
      tag: 'QR and Phones Attendance',
      title: 'Staff attendance on your team’s <em>own phones</em>',
      sub: 'Print a QR code for each branch. Staff check in and out with their phone, and GPS and phone checks stop cheating. No attendance machine to buy.',
      gps: 'Inside the branch area', gpsSub: 'GPS checked on every scan',
      in: 'Checked in 08:03 AM', inSub: 'Head Office · 31 m · on time',
      features: [
        ['qr', 'QR scan or one-tap check-in'],
        ['pin', 'GPS area for every branch'],
        ['cal', 'Leave, overtime & corrections'],
        ['money', 'Payroll with Tax on Salary & NSSF'],
        ['tg', 'Telegram alerts & mini app'],
        ['chart', 'Live dashboard, Excel & PDF'],
      ],
      trial: 'FREE 1-month trial',
      from: 'Plans from', price: '$9 / month',
      demo: 'See it working, try the live demo:',
      signup: 'Start your free trial:',
      qr: 'Scan to chat on Telegram @mysoftkh',
    },
    km: {
      tag: 'QR and Phones Attendance',
      title: 'ចុះវត្តមានបុគ្គលិក<br>ដោយប្រើ<em>ទូរស័ព្ទរបស់ពួកគេផ្ទាល់</em>',
      sub: 'បោះពុម្ព QR កូដសម្រាប់សាខានីមួយៗ។ បុគ្គលិកចុះវត្តមានចូល-ចេញ ដោយទូរស័ព្ទរបស់ខ្លួន ហើយ GPS និងការផ្ទៀងផ្ទាត់ទូរស័ព្ទ ការពារការបន្លំ។ មិនចាំបាច់ទិញម៉ាស៊ីនស្កេនវត្តមានទេ។',
      gps: 'នៅក្នុងតំបន់សាខា', gpsSub: 'ពិនិត្យ GPS រាល់ពេលស្កេន',
      in: 'ចុះវត្តមានចូល 08:03 AM', inSub: 'ការិយាល័យកណ្តាល · 31 m · ទាន់ម៉ោង',
      features: [
        ['qr', 'ស្កេន QR ឬចុចប៊ូតុងតែម្តង'],
        ['pin', 'តំបន់ GPS សម្រាប់គ្រប់សាខា'],
        ['cal', 'ច្បាប់ឈប់សម្រាក ម៉ោងបន្ថែម និងការកែតម្រូវ'],
        ['money', 'បើកប្រាក់ខែ ពន្ធលើប្រាក់បៀវត្ស និង ប.ស.ស'],
        ['tg', 'ជូនដំណឹង និងកម្មវិធីតាម Telegram'],
        ['chart', 'ផ្ទាំងគ្រប់គ្រងផ្ទាល់ Excel និង PDF'],
      ],
      trial: 'សាកល្បងឥតគិតថ្លៃ ១ ខែ',
      from: 'គម្រោងចាប់ពី', price: '$9 / ខែ',
      demo: 'មើលការប្រើប្រាស់ជាក់ស្តែង សាកល្បងផ្ទាល់៖',
      signup: 'ចុះឈ្មោះសាកល្បងឥតគិតថ្លៃ៖',
      qr: 'ស្កេនដើម្បីជជែកតាម Telegram @mysoftkh',
    },
  };
  const lang = new URLSearchParams(location.search).get('lang') === 'km' ? 'km' : 'en';
  const t = T[lang];
  document.documentElement.lang = lang;
  document.body.classList.toggle('km', lang === 'km');
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t[el.dataset.t]; });
  document.getElementById('features').innerHTML = t.features.map(([ic, text]) =>
    `<div class="feature"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]}</svg></span><span>${text}</span></div>`).join('');
</script>
</body>
</html>
